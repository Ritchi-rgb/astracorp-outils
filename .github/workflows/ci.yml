name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
        
      - name: Installer les outils de test
        run: pip install pytest==9.2.0
             pip install pytest-cov==7.1.0

      - name: Lancer les tests
        run: pytest -v --cov=outils --cov-report=term-missing --cov-fail-under=80